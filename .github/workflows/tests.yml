# Starter CI workflow for Part E. Complete it so that:
#   - every push runs the smoke tests
#   - a scheduled nightly run executes the FULL suite (including slow tests)
# It must actually run on GitHub Actions (checked via your Actions tab).

name: tests

on:
  push:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: 

jobs:
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -m smoke -v
  
      full-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -v
